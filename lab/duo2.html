<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Duo Test</title>
<script src="coi-serviceworker.js"></script>
<style>
:root{--bg:#0b0b0d;--fg:#ddd}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:12px system-ui}
.wrap{display:flex;height:100%;gap:4px}
.half{flex:1;display:flex;flex-direction:column;min-width:0}
.half b{padding:2px 6px}
iframe{flex:1;border:0;width:100%}
</style></head>
<body><div class="wrap">
<div class="half"><b>Player 1</b><iframe id="p1" allow="cross-origin-isolated; gamepad; fullscreen; autoplay" data-p="1"></iframe></div>
<div class="half"><b>Player 2</b><iframe id="p2" allow="cross-origin-isolated; gamepad; fullscreen; autoplay" data-p="2"></iframe></div>
</div>
<script>const lab=location.search.includes("lab"); document.querySelectorAll("iframe[data-p]").forEach(f=>f.src=(lab?"./":"../")+"?p="+f.dataset.p+(lab?"&cb="+Date.now():""));</script></body></html>
